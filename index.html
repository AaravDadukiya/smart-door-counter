<!doctype html>
<html lang="gu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Door IN OUT Counter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1117;color:#fff;font-family:Arial,sans-serif}
header{padding:10px;text-align:center;background:#161b22}h2{margin:0;font-size:20px}
#stage{position:relative;width:100%;max-width:1000px;margin:auto;background:#000;touch-action:none}
video{display:block;width:100%;height:auto;min-height:55vh;object-fit:cover}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.panel{max-width:1000px;margin:auto;padding:10px;background:#161b22}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{text-align:center;padding:8px;border-radius:9px;background:#222831}
.n{font-size:22px;font-weight:bold}.green{color:#45e07c}.red{color:#ff6975}.blue{color:#5ab8ff}.yellow{color:#ffd166}
.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
button{border:0;border-radius:8px;padding:11px;background:#303844;color:white;font-weight:bold}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
.info{font-size:12px;color:#b9c0ca;margin-top:8px;line-height:1.45}
#status{text-align:center;color:#ffd166;margin:7px 0;font-size:13px}
input{width:100%}
</style>
</head>
<body>
<header><h2>🚪 Smart Door IN / OUT Counter</h2></header>

<div id="stage">
 <video id="video" autoplay playsinline muted></video>
 <canvas id="canvas"></canvas>
</div>

<div class="panel">
 <div class="stats">
  <div class="stat">IN<div id="in" class="n green">0</div></div>
  <div class="stat">OUT<div id="out" class="n red">0</div></div>
  <div class="stat">અંદર<div id="inside" class="n blue">0</div></div>
  <div class="stat">Tracked<div id="tracked" class="n yellow">0</div></div>
 </div>

 <div class="buttons">
  <button id="start">📷 Camera</button>
  <button id="reset">↺ Reset</button>
  <button id="csv">⬇ CSV</button>
 </div>

 <div id="status">Camera શરૂ કરો. લાલ લાઈનને આંગળીથી Drag કરી ગોઠવો.</div>
 <div class="info">
  <b>ગોઠવણી:</b> લાલ લાઈનને આંગળીથી ખેંચો. 🟢 → IN અને 🔴 ← OUT.
  વ્યક્તિનો મધ્ય ભાગ લાઈન પાર કરે ત્યારે ગણતરી થાય છે. Detection માટે પ્રકાશ પૂરતો રાખો અને કેમેરો સ્થિર રાખો.
 </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
<script>
const video=document.getElementById('video'), canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d'), stage=document.getElementById('stage');
let model,stream,running=false, lineY=.50, nextId=1, tracks=new Map();
let inCount=0,outCount=0,events=[];

// ---------- Camera ----------
async function start(){
 try{
  if(!navigator.mediaDevices?.getUserMedia) throw new Error('Camera API unavailable');
  document.getElementById('status').textContent='Camera શરૂ થઈ રહી છે...';
  stream=await navigator.mediaDevices.getUserMedia({
   video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
  });
  video.srcObject=stream; await video.play(); resize();
  document.getElementById('status').textContent='AI model લોડ થઈ રહ્યું છે...';
  model=await cocoSsd.load({base:'lite_mobilenet_v2'});
  running=true; document.getElementById('status').textContent='ચાલુ — લાઈન Drag કરીને ગોઠવી શકો છો.';
  loop();
 }catch(e){document.getElementById('status').textContent='Camera error: '+e.message+' | HTTPS અને permission તપાસો.'}
}
function resize(){if(video.videoWidth){canvas.width=video.videoWidth;canvas.height=video.videoHeight}}
window.addEventListener('resize',resize);

// ---------- Drag line ----------
let dragging=false;
function pointerY(e){
 const r=canvas.getBoundingClientRect();
 return Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
}
canvas.addEventListener('pointerdown',e=>{
 const r=canvas.getBoundingClientRect(), y=r.top+lineY*r.height;
 if(Math.abs(e.clientY-y)<45){dragging=true;canvas.setPointerCapture(e.pointerId);e.preventDefault();}
});
canvas.addEventListener('pointermove',e=>{
 if(!dragging)return; lineY=pointerY(e); e.preventDefault();
});
canvas.addEventListener('pointerup',()=>dragging=false);
canvas.addEventListener('pointercancel',()=>dragging=false);

// ---------- Tracking ----------
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function side(y){return y < canvas.height*lineY ? -1:1}
function match(x,y){
 let best=null,bd=Infinity;
 for(const [id,t] of tracks){
  const d=dist({x,y},t);
  if(d<bd && d<canvas.width*.15){bd=d;best=id}
 }
 return best;
}
function update(){
 document.getElementById('in').textContent=inCount;
 document.getElementById('out').textContent=outCount;
 document.getElementById('inside').textContent=Math.max(0,inCount-outCount);
 document.getElementById('tracked').textContent=tracks.size;
}
function logEvent(type,id){
 events.push({time:new Date().toLocaleString(),type,id});
}

function drawLine(){
 const y=canvas.height*lineY;
 ctx.save();
 ctx.lineWidth=Math.max(5,canvas.width/170);
 ctx.strokeStyle='#ff3030';ctx.setLineDash([20,10]);
 ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvas.width,y);ctx.stroke();ctx.setLineDash([]);
 ctx.fillStyle='#ff3030';ctx.font='bold '+Math.max(18,canvas.width/35)+'px Arial';
 ctx.fillText('COUNTING LINE',12,Math.max(25,y-14));
 // Direction arrows
 ctx.fillStyle='#45e07c';ctx.font='bold '+Math.max(20,canvas.width/28)+'px Arial';
 ctx.fillText('↓ IN',canvas.width*.78,Math.max(30,y-15));
 ctx.fillStyle='#ff6975';
 ctx.fillText('↑ OUT',canvas.width*.78,y+35);
 ctx.restore();
}

async function loop(){
 if(!running)return;
 if(video.readyState>=2){
  resize();ctx.clearRect(0,0,canvas.width,canvas.height);
  let ps=await model.detect(video);
  ps=ps.filter(p=>p.class==='person'&&p.score>=.55);
  const seen=new Set();
  for(const p of ps){
   const [x,y,w,h]=p.bbox,cx=x+w/2,cy=y+h*.55;
   let id=match(cx,cy);
   if(id===null){
    id=nextId++;tracks.set(id,{x:cx,y:cy,lastSide:side(cy),lastSeen:Date.now(),cool:0});
   }else{
    const t=tracks.get(id), ns=side(cy);
    if(t.lastSide!==ns && Date.now()-t.cool>700){
     if(t.lastSide===-1&&ns===1){inCount++;logEvent('IN',id)}
     if(t.lastSide===1&&ns===-1){outCount++;logEvent('OUT',id)}
     t.cool=Date.now();update();
    }
    t.x=cx;t.y=cy;t.lastSide=ns;t.lastSeen=Date.now();
   }
   seen.add(id);
   ctx.strokeStyle='#00e676';ctx.lineWidth=3;ctx.strokeRect(x,y,w,h);
   ctx.fillStyle='#00e676';ctx.font='bold 16px Arial';ctx.fillText('ID '+id,x,Math.max(18,y-5));
  }
  const now=Date.now();
  for(const [id,t] of tracks)if(now-t.lastSeen>1800)tracks.delete(id);
  drawLine();update();
 }
 requestAnimationFrame(loop);
}

// ---------- Controls ----------
document.getElementById('start').onclick=start;
document.getElementById('reset').onclick=()=>{
 inCount=0;outCount=0;events=[];tracks.clear();nextId=1;update();
};
document.getElementById('csv').onclick=()=>{
 const rows=[['Time','Direction','Person ID'],...events.map(e=>[e.time,e.type,e.id])];
 rows.push([]);rows.push(['TOTAL IN',inCount]);rows.push(['TOTAL OUT',outCount]);
 const csv=rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\\n');
 const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='door_in_out_'+new Date().toISOString().slice(0,10)+'.csv';a.click();
 URL.revokeObjectURL(a.href);
};
</script>
</body>
</html>
